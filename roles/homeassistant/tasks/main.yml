---
- name: Create homeassistant directory
  ansible.builtin.file:
    path: /opt/homeassistant
    state: directory
    mode: "0755"

- name: Deploy homeassistant Docker Compose
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/homeassistant/compose.yml
    owner: root
    group: root
    mode: "0600"

- name: Start homeassistant stack
  community.docker.docker_compose_v2:
    project_src: /opt/homeassistant
