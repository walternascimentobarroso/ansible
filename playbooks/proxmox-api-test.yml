---
- name: Test Proxmox API
  hosts: localhost
  gather_facts: false

  vars:
    proxmox_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    proxmox_api_user: "{{ lookup('env', 'PROXMOX_USER') }}"
    proxmox_api_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
    proxmox_api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"

  tasks:
    - name: Validate Proxmox API configuration
      ansible.builtin.assert:
        that:
          - proxmox_host | length > 0
          - proxmox_api_user | length > 0
          - proxmox_api_token_id | length > 0
          - proxmox_api_token_secret | length > 0
        fail_msg: "Proxmox API environment variables are not configured."

    - name: Get Proxmox nodes
      ansible.builtin.uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: false
        return_content: true
      register: proxmox_nodes
      no_log: true

    - name: Show Proxmox nodes
      ansible.builtin.debug:
        var: proxmox_nodes.json.data
