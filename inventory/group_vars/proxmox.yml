---
proxmox_node: pve

proxmox_template_storage: local
proxmox_template: debian-13-standard_13.6-1_amd64.tar.zst

proxmox_lxc_storage: local-lvm
proxmox_bridge: vmbr0

# Proxmox API authentication (used by tasks that talk to the API directly)
proxmox_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
proxmox_api_user: "{{ lookup('env', 'PROXMOX_USER') }}"
proxmox_api_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
proxmox_api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"

proxmox_api_url: "https://{{ proxmox_host }}:8006/api2/json"
proxmox_api_auth: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"

# LXC specs (consumed by roles/proxmox_lxc and roles/lxc_bootstrap; play hosts are `proxmox`)
# Nextcloud
nextcloud_vmid: "{{ lookup('env', 'NEXTCLOUD_VMID') }}"
nextcloud_hostname: "{{ lookup('env', 'NEXTCLOUD_HOSTNAME') }}"
nextcloud_cores: "{{ lookup('env', 'NEXTCLOUD_CORES') }}"
nextcloud_memory: "{{ lookup('env', 'NEXTCLOUD_MEMORY') }}"
nextcloud_swap: "{{ lookup('env', 'NEXTCLOUD_SWAP') }}"
nextcloud_disk: "{{ lookup('env', 'NEXTCLOUD_DISK') }}"
nextcloud_data_size: "{{ lookup('env', 'NEXTCLOUD_DATA_SIZE') }}"
nextcloud_data_mount: "{{ lookup('env', 'NEXTCLOUD_DATA_MOUNT') }}"
nextcloud_ip: "{{ lookup('env', 'NEXTCLOUD_IP') }}"
nextcloud_cidr: "{{ lookup('env', 'NEXTCLOUD_CIDR') }}"
nextcloud_gateway: "{{ lookup('env', 'NEXTCLOUD_GATEWAY') }}"

# Pi-hole
pihole_vmid: "{{ lookup('env', 'PIHOLE_VMID') }}"
pihole_hostname: "{{ lookup('env', 'PIHOLE_HOSTNAME') }}"
pihole_cores: "{{ lookup('env', 'PIHOLE_CORES') }}"
pihole_memory: "{{ lookup('env', 'PIHOLE_MEMORY') }}"
pihole_swap: "{{ lookup('env', 'PIHOLE_SWAP') }}"
pihole_disk: "{{ lookup('env', 'PIHOLE_DISK') }}"
pihole_ip: "{{ lookup('env', 'PIHOLE_IP') }}"
pihole_cidr: "{{ lookup('env', 'PIHOLE_CIDR') }}"
pihole_gateway: "{{ lookup('env', 'PIHOLE_GATEWAY') }}"
