---
- name: Create Traefik directory
  ansible.builtin.file:
    path: /opt/traefik
    state: directory
    mode: "0755"

- name: Create Traefik dynamic configuration directory
  ansible.builtin.file:
    path: /opt/traefik/dynamic
    state: directory
    mode: "0755"

- name: Deploy Traefik configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: /opt/traefik/traefik.yml
    mode: "0644"

- name: Create Traefik certificates directory
  ansible.builtin.file:
    path: /opt/traefik/certs
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy Traefik TLS certificate
  ansible.builtin.copy:
    src: "{{ inventory_dir }}/../certs/homelab/traefik/{{ homelab_domain }}.crt"
    dest: /opt/traefik/certs/{{ homelab_domain }}.crt
    owner: root
    group: root
    mode: "0644"
  notify: Restart Traefik

- name: Copy Traefik TLS private key
  ansible.builtin.copy:
    src: "{{ inventory_dir }}/../certs/homelab/traefik/{{ homelab_domain }}.key"
    dest: /opt/traefik/certs/{{ homelab_domain }}.key
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Traefik

- name: Deploy Traefik TLS configuration
  ansible.builtin.template:
    src: tls.yml.j2
    dest: /opt/traefik/dynamic/tls.yml
    owner: root
    group: root
    mode: "0644"

- name: Deploy Traefik routes
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/opt/traefik/dynamic/{{ item | basename | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: "0644"
  with_fileglob: "{{ role_path }}/templates/routes/*.j2"

- name: Deploy Traefik Docker Compose
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/traefik/compose.yml
    mode: "0644"

- name: Start Traefik
  community.docker.docker_compose_v2:
    project_src: /opt/traefik
