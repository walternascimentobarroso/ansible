---
- name: Install Pi-hole prerequisites
  ansible.builtin.apt:
    name:
      - git
      - curl
      - ca-certificates
      - dnsutils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Clone Pi-hole repository
  ansible.builtin.git:
    repo: "{{ pihole_repo }}"
    dest: "{{ pihole_repo_path }}"
    version: "{{ pihole_version }}"
    depth: 1
    force: false

- name: Check if Pi-hole is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/pihole
  register: pihole_binary

- name: Preseed and install Pi-hole
  when: not pihole_binary.stat.exists
  block:
    - name: Create Pi-hole config directory
      ansible.builtin.file:
        path: /etc/pihole
        state: directory
        mode: "0755"

    - name: Write pihole.toml
      ansible.builtin.template:
        src: pihole.toml.j2
        dest: /etc/pihole/pihole.toml
        mode: "0644"

    - name: Install Pi-hole
      ansible.builtin.command:
        cmd: bash basic-install.sh --unattended
        chdir: "{{ pihole_repo_path }}/automated install"
      changed_when: true

- name: Configure Pi-hole DHCP
  ansible.builtin.command:
    cmd: >-
      pihole-FTL --config {{ item.key }} {{ item.value }}
  loop:
    - key: dhcp.start
      value: "{{ pihole_dhcp_start }}"
    - key: dhcp.end
      value: "{{ pihole_dhcp_end }}"
    - key: dhcp.router
      value: "{{ pihole_dhcp_router }}"
    - key: dhcp.netmask
      value: "{{ pihole_dhcp_netmask }}"
    - key: dhcp.leaseTime
      value: "{{ pihole_dhcp_lease_time }}"
    - key: dhcp.ipv6
      value: "false"
  changed_when: false

- name: Configure Pi-hole DHCP server state
  ansible.builtin.command:
    cmd: "pihole-FTL --config dhcp.active {{ pihole_dhcp_enabled }}"
  changed_when: false

- name: Disable Pi-hole NTP services
  ansible.builtin.command:
    cmd: "pihole-FTL --config {{ item }} false"
  loop:
    - ntp.sync.active
    - ntp.ipv4.active
    - ntp.ipv6.active
  changed_when: false

- name: Set Pi-hole admin password
  ansible.builtin.command:
    cmd: "pihole setpassword {{ pihole_admin_password | quote }}"
  changed_when: false
  no_log: true

- name: Enable custom dnsmasq configuration directory
  ansible.builtin.command:
    cmd: "pihole-FTL --config misc.etc_dnsmasq_d true"
  changed_when: false

- name: Deploy homelab DNS configuration
  ansible.builtin.template:
    src: homelab.conf.j2
    dest: /etc/dnsmasq.d/99-homelab.conf
    owner: root
    group: root
    mode: "0644"
  register: homelab_dns_config

- name: Restart Pi-hole FTL after DNS configuration change
  ansible.builtin.service:
    name: pihole-FTL
    state: restarted
  when: homelab_dns_config.changed

- name: Sync Pi-hole adlists
  ansible.builtin.command:
    argv:
      - pihole-FTL
      - sqlite3
      - /etc/pihole/gravity.db
      - >-
        BEGIN;
        {% for adlist in pihole_adlists %}
        INSERT OR IGNORE INTO adlist (address, comment)
        VALUES ('{{ adlist.url }}', '{{ adlist.comment }}');
        {% endfor %}
        DELETE FROM gravity WHERE adlist_id IN (SELECT id FROM adlist WHERE {{ pihole_unmanaged_adlists }});
        DELETE FROM adlist WHERE {{ pihole_unmanaged_adlists }};
        COMMIT;
        SELECT total_changes();
  vars:
    pihole_unmanaged_adlists: >-
      type = 0 AND address NOT IN ('{{ pihole_adlists | map(attribute='url') | join("', '") }}')
  register: pihole_adlists_sync
  changed_when: pihole_adlists_sync.stdout | int > 0
  notify: Update Pi-hole gravity

- name: Rebuild gravity before verifying DNS
  ansible.builtin.meta: flush_handlers

- name: Verify Pi-hole answers local DNS queries
  ansible.builtin.command:
    cmd: "dig +short +time=2 +tries=1 @127.0.0.1 example.com"
  register: pihole_dns_check
  until:
    - pihole_dns_check.rc == 0
    - pihole_dns_check.stdout | length > 0
  retries: 5
  delay: 3
  changed_when: false
  failed_when: false

- name: Fail if Pi-hole DNS is not responding
  ansible.builtin.fail:
    msg: "Pi-hole DNS did not respond after 5 attempts."
  when:
    - pihole_dns_check.rc != 0 or pihole_dns_check.stdout | length == 0

- name: Verify every adlist is enabled and has domains
  ansible.builtin.command:
    argv:
      - pihole-FTL
      - sqlite3
      - /etc/pihole/gravity.db
      - "SELECT address FROM adlist WHERE type = 0 AND (enabled = 0 OR number = 0);"
  register: pihole_broken_adlists
  changed_when: false
  failed_when: pihole_broken_adlists.stdout | length > 0

- name: Verify filtering and internal DNS
  ansible.builtin.command:
    cmd: "dig +short +time=2 +tries=1 @127.0.0.1 {{ item.name }}"
  register: pihole_dns_answer
  changed_when: false
  failed_when: not (pihole_dns_answer.stdout is regex(item.answer))
  loop:
    - name: google-analytics.com
      answer: '^0\.0\.0\.0$'
    - name: github.com
      answer: '^(?!0\.0\.0\.0$).+'
    - name: "pihole.{{ homelab_domain }}"
      answer: "^{{ traefik_ip | regex_escape }}$"
