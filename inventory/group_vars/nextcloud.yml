---
# Application configuration
nextcloud_db_name: "{{ lookup('env', 'NEXTCLOUD_DB_NAME') }}"
nextcloud_db_user: "{{ lookup('env', 'NEXTCLOUD_DB_USER') }}"
nextcloud_db_password: "{{ lookup('env', 'NEXTCLOUD_DB_PASSWORD') }}"
nextcloud_admin_user: "{{ lookup('env', 'NEXTCLOUD_ADMIN_USER') }}"
nextcloud_admin_password: "{{ lookup('env', 'NEXTCLOUD_ADMIN_PASSWORD') }}"
nextcloud_trusted_domains: "{{ ansible_host }}"
onlyoffice_jwt_secret: "{{ lookup('env', 'ONLYOFFICE_JWT_SECRET') }}"
nextcloud_onlyoffice_settings:
  DocumentServerUrl: "https://office.{{ homelab_domain }}/"
  DocumentServerInternalUrl: "http://onlyoffice/"
  StorageUrl: "http://nextcloud/"
  jwt_secret: "{{ onlyoffice_jwt_secret }}"
