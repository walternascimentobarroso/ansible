---
- name: Create AI data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /data/ollama
    - /data/open-webui
    - /opt/ai

- name: Deploy AI Docker Compose
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/ai/compose.yml
    owner: root
    group: root
    mode: "0600"

- name: Start AI stack
  ansible.builtin.command:
    cmd: docker compose -f /opt/ai/compose.yml up -d
  register: ai_compose_up
  changed_when: >-
    'Started' in ai_compose_up.stderr or
    'Created' in ai_compose_up.stderr