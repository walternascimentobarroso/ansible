---
- name: Create AI data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ lxc.data_mount }}/ollama"
    - "{{ lxc.data_mount }}/open-webui"
    - /opt/ai

- name: Deploy AI Docker Compose
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/ai/compose.yml
    owner: root
    group: root
    mode: "0600"

- name: Start AI stack
  community.docker.docker_compose_v2:
    project_src: /opt/ai
