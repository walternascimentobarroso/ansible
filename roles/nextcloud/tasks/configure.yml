---
- name: Read Nextcloud trusted domains
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:system:get trusted_domains
  register: nextcloud_trusted_domains_current
  changed_when: false

# "nextcloud" is the hostname OnlyOffice uses on the internal Docker network
- name: Configure Nextcloud trusted domains
  ansible.builtin.command:
    cmd: >
      docker exec -u www-data nextcloud
      php occ config:system:set trusted_domains {{ item.0 }}
      --value={{ item.1 }}
  loop: "{{ [2, 3] | zip(['nextcloud.' ~ homelab_domain, 'nextcloud']) | list }}"
  when: item.1 not in nextcloud_trusted_domains_current.stdout_lines
  changed_when: true

- name: Read Nextcloud overwrite protocol
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:system:get overwriteprotocol
  register: nextcloud_overwriteprotocol
  changed_when: false
  failed_when: false

- name: Configure Nextcloud overwrite protocol
  ansible.builtin.command:
    cmd: >
      docker exec -u www-data nextcloud
      php occ config:system:set overwriteprotocol
      --value=https
  when: nextcloud_overwriteprotocol.stdout != "https"
  changed_when: true

- name: Read Nextcloud trusted proxies
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:system:get trusted_proxies
  register: nextcloud_trusted_proxies_current
  changed_when: false
  failed_when: false

- name: Configure Traefik as Nextcloud trusted proxy
  ansible.builtin.command:
    cmd: >
      docker exec -u www-data nextcloud
      php occ config:system:set trusted_proxies 0
      --value={{ traefik_ip }}
  when: traefik_ip not in nextcloud_trusted_proxies_current.stdout_lines
  changed_when: true

- name: Read Nextcloud skeleton directory
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:system:get skeletondirectory
  register: nextcloud_skeleton_directory
  changed_when: false
  failed_when: false

- name: Configure Nextcloud skeleton directory
  ansible.builtin.command:
    cmd: >
      docker exec -u www-data nextcloud
      php occ config:system:set skeletondirectory
      --value=/skeleton
  when: nextcloud_skeleton_directory.stdout != "/skeleton"
  changed_when: true

- name: Read Nextcloud local remote servers setting
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:system:get allow_local_remote_servers
  register: nextcloud_allow_local_remote_servers
  changed_when: false
  failed_when: false

# OnlyOffice and Nextcloud reach each other on the internal Docker network
- name: Allow Nextcloud to reach local servers
  ansible.builtin.command:
    cmd: >
      docker exec -u www-data nextcloud
      php occ config:system:set allow_local_remote_servers
      --value=true --type=boolean
  when: nextcloud_allow_local_remote_servers.stdout != "true"
  changed_when: true

- name: Install ONLYOFFICE app
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ app:install onlyoffice
  register: nextcloud_onlyoffice_install
  changed_when: "'installed' in nextcloud_onlyoffice_install.stdout and 'already' not in nextcloud_onlyoffice_install.stdout"
  failed_when:
    - nextcloud_onlyoffice_install.rc != 0
    - "'already installed' not in nextcloud_onlyoffice_install.stdout"

- name: Read ONLYOFFICE app settings
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:app:get onlyoffice {{ item.key }}
  loop: "{{ nextcloud_onlyoffice_settings | dict2items }}"
  register: nextcloud_onlyoffice_settings_current
  changed_when: false
  failed_when: false
  no_log: true

- name: Configure ONLYOFFICE app settings
  ansible.builtin.command:
    cmd: >
      docker exec -u www-data nextcloud
      php occ config:app:set onlyoffice {{ item.item.key }}
      --value={{ item.item.value }}
  loop: "{{ nextcloud_onlyoffice_settings_current.results }}"
  when: item.stdout != item.item.value
  changed_when: true
  no_log: true
