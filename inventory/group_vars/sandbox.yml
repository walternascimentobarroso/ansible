---
sandbox_apps:
  - name: resume-matcher
    uid: 1000
  - name: excalidraw
  - name: stirlingpdf
  - name: homepage

homepage_services:
  - { group: Infra, name: Pi-hole, subdomain: pihole, icon: pi-hole.png, description: DNS e bloqueio de anúncios }
  - { group: Infra, name: Home Assistant, subdomain: ha, icon: home-assistant.png, description: Automação da casa }
  - { group: Cloud, name: Nextcloud, subdomain: nextcloud, icon: nextcloud.png, description: Ficheiros e calendário }
  - { group: Cloud, name: OnlyOffice, subdomain: office, icon: onlyoffice.png, description: Editor de documentos }
  - { group: Cloud, name: Vaultwarden, subdomain: vault, icon: vaultwarden.png, description: Gestor de passwords }
  - { group: Apps, name: AI, subdomain: ai, icon: ollama.png, description: LLMs locais }
  - { group: Apps, name: Resume Matcher, subdomain: resume, icon: mdi-file-account, description: CV vs vagas }
  - { group: Apps, name: Stirling PDF, subdomain: pdf, icon: stirling-pdf.png, description: Ferramentas de PDF }
  - { group: Apps, name: Excalidraw, subdomain: excalidraw, icon: excalidraw.png, description: Quadro branco }

sandbox_llm_provider: groq

sandbox_llm_providers:
  groq:
    provider: groq
    model: groq/qwen/qwen3.8-27b
    api_base: https://api.groq.com/openai/v1
    api_key: "{{ lookup('env', 'GROQ_API_KEY') }}"
  gemini:
    provider: gemini
    model: gemini/gemini-3.5-flash-lite
    api_base: https://generativelanguage.googleapis.com/v1beta
    api_key: "{{ lookup('env', 'GEMINI_API_KEY') }}"
  ollama:
    provider: ollama
    model: qwen3:1.7b
    api_base: "http://{{ hostvars[groups['ai'][0]].ansible_host }}:11434"
    api_key: ""

sandbox_llm: "{{ sandbox_llm_providers[sandbox_llm_provider] }}"
