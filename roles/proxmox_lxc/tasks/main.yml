---
- name: Check if LXC {{ lxc_vmid }} exists
  ansible.builtin.uri:
    url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc/{{ lxc_vmid }}/config"
    method: GET
    headers:
      Authorization: "{{ proxmox_api_auth }}"
    validate_certs: false
    status_code:
      - 200
      - 500
    return_content: true
  register: proxmox_lxc_lookup
  no_log: true

- name: Build LXC creation parameters
  ansible.builtin.set_fact:
    lxc_create_body:
      vmid: "{{ lxc_vmid }}"
      hostname: "{{ lxc_hostname }}"
      ostemplate: "{{ proxmox_template_storage }}:vztmpl/{{ proxmox_template }}"
      storage: "{{ proxmox_lxc_storage }}"
      rootfs: "{{ proxmox_lxc_storage }}:{{ lxc_disk }}"
      cores: "{{ lxc_cores }}"
      memory: "{{ lxc_memory }}"
      swap: "{{ lxc_swap }}"
      net0: >-
        name=eth0,bridge={{ proxmox_bridge }},{{
          (lxc_ip | length > 0) | ternary(
            'ip=' ~ lxc_ip ~ '/' ~ lxc_cidr ~ ',gw=' ~ lxc_gateway,
            'ip=dhcp'
          )
        }}
      unprivileged: 1
      features: "nesting=1"
      start: 1

- name: Add data volume to LXC creation parameters
  ansible.builtin.set_fact:
    lxc_create_body: >-
      {{
        lxc_create_body | combine({
          'mp0': proxmox_lxc_storage ~ ':' ~ lxc_data_size ~ ',mp=' ~ lxc_data_mount
        })
      }}
  when:
    - lxc_data_size | length > 0
    - lxc_data_mount | length > 0

- name: Create LXC {{ lxc_vmid }}
  ansible.builtin.uri:
    url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc"
    method: POST
    headers:
      Authorization: "{{ proxmox_api_auth }}"
    body_format: form-urlencoded
    body: "{{ lxc_create_body }}"
    status_code: 200
    return_content: true
    validate_certs: false
  when: proxmox_lxc_lookup.status != 200
  no_log: true

- name: Get LXC {{ lxc_vmid }} configuration
  ansible.builtin.command:
    cmd: "pct config {{ lxc_vmid }}"
  register: proxmox_lxc_config
  changed_when: false

- name: Add LXC {{ lxc_vmid }} data volume
  ansible.builtin.command:
    cmd: >
      pct set {{ lxc_vmid }}
      -mp0 {{ proxmox_lxc_storage }}:{{ lxc_data_size }},mp={{ lxc_data_mount }}
  when:
    - lxc_data_size | length > 0
    - lxc_data_mount | length > 0
    - "'mp0:' not in proxmox_lxc_config.stdout"
