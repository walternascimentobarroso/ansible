---
- name: Create vaultwarden directory
  ansible.builtin.file:
    path: /opt/vaultwarden
    state: directory
    mode: "0755"

- name: Deploy vaultwarden Docker Compose
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/vaultwarden/compose.yml
    owner: root
    group: root
    mode: "0600"

- name: Start vaultwarden stack
  community.docker.docker_compose_v2:
    project_src: /opt/vaultwarden
