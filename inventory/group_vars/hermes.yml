---
# Application configuration
hermes_dashboard_user: "{{ lookup('env', 'HERMES_DASHBOARD_USER') }}"
hermes_dashboard_password: "{{ lookup('env', 'HERMES_DASHBOARD_PASSWORD') }}"
hermes_telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN') }}"
hermes_telegram_allowed_users: "{{ lookup('env', 'TELEGRAM_ALLOWED_USERS') }}"

# Codex (ChatGPT login); authenticate once with `hermes auth` inside the container
hermes_model:
  model.provider: openai-codex
  model.base_url: https://chatgpt.com/backend-api/codex
  model.default: gpt-5.6-luna
