---
- name: Create app data directories
  ansible.builtin.file:
    path: "/opt/apps/{{ item.name }}/data"
    state: directory
    owner: "{{ item.uid | default(omit) }}"
    group: "{{ item.uid | default(omit) }}"
    mode: "0755"
  loop: "{{ sandbox_apps }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy app Docker Compose
  ansible.builtin.template:
    src: "apps/{{ item.name }}.yml.j2"
    dest: "/opt/apps/{{ item.name }}/compose.yml"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ sandbox_apps }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy Homepage service catalog
  ansible.builtin.template:
    src: homepage/services.yaml.j2
    dest: /opt/apps/homepage/data/services.yaml
    owner: root
    group: root
    mode: "0644"
  when: "'homepage' in sandbox_apps | map(attribute='name')"

- name: Start app stacks
  community.docker.docker_compose_v2:
    project_src: "/opt/apps/{{ item.name }}"
  loop: "{{ sandbox_apps }}"
  loop_control:
    label: "{{ item.name }}"
